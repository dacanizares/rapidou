<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rapidou</title>
    <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
    <main class="shell">
        <section class="card auth-card" id="login-view">
            <p class="eyebrow">Rapidou</p>
            <h1>Sign in</h1>
            <form class="stack" id="login-form">
                <label>Email <input id="login-email" name="email" type="email" autocomplete="username" required></label>
                <label>Password <input id="login-password" name="password" type="password" autocomplete="current-password" required></label>
                <p class="message" id="login-error" role="alert"></p>
                <button class="btn btn-primary" id="login" type="submit">Sign in</button>
            </form>
        </section>

        <section class="stack hidden" id="app-view">
            <header class="row page-header">
                <div><p class="eyebrow">Rapidou</p><h1>Users</h1></div>
                <div class="row"><span id="current-user"></span><button class="btn" id="logout" type="button">Sign out</button></div>
            </header>

            <form class="card grid user-form" id="user-form">
                <h2>New user</h2>
                <label>Name <input id="name" name="name" autocomplete="name" required></label>
                <label>Email <input id="email" name="email" type="email" autocomplete="email" required></label>
                <label>Password <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></label>
                <p class="message" id="user-error" role="alert"></p>
                <button class="btn btn-primary" id="save" type="submit">Create user</button>
            </form>

            <section class="card section-users">
                <h2>People</h2>
                <div class="stack" id="users" aria-live="polite"></div>
            </section>
        </section>
    </main>
    <script src="/assets/app.js" defer></script>
</body>
</html>
